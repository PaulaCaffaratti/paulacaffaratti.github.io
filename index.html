.metrica.desvio-positivo{border-left:5px solid #198754;}

.grid-curva{

  grid-template-columns:minmax(0,2fr) minmax(270px,.75fr);

.chart-wrap{

  position:relative;
}

/* PENDIENTES */

.pendientes-resumen{

  grid-template-columns:repeat(2,1fr);
  gap:12px;

.pendiente-kpi{

  border:1px solid #dce4ec;

.pendiente-kpi span{

  font-size:11px;
  font-weight:800;

  text-transform:uppercase;

.pendiente-kpi strong{

  margin-top:6px;
  font-size:22px;
  color:#173650;

.tabla-pendientes-wrap{

}

.tabla-pendientes{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

.tabla-pendientes th,
.tabla-pendientes td{
  padding:11px 12px;
  border-bottom:1px solid #e5eaf0;
  text-align:right;
  white-space:nowrap;
}

.tabla-pendientes th:first-child,
.tabla-pendientes td:first-child{

}

.tabla-pendientes th{
  background:#f7f9fb;
  color:#5f7185;
  font-size:10px;
  text-transform:uppercase;
}

.tabla-pendientes tfoot td{
  font-weight:800;
  background:#f2f6f9;
  color:#173650;
}

.sin-pendientes{
  padding:20px;
  text-align:center;
  color:#28734b;
  font-weight:800;
}



/* =====================================================
DETALLE DEL DESVÍO
Compara, por tipo, el volumen planificado acumulado a hoy
contra el volumen realmente montado a hoy.
===================================================== */

function planPorTipoEnFecha(fecha){

  const objetivo=inicioDia(fecha);
  const resultado={};

  BASE_PROYECTO.forEach(item=>{

    const tipo=normalizarTipo(item.tipo);
    const inicio=inicioDia(crearFecha(item.inicio));
    const fin=inicioDia(crearFecha(item.fin));
    const volumenTotal=
      Number(item.cantidad||0)*
      Number(item.m3||0);

    let volumenPlan=0;

    if(objetivo>=fin){

      volumenPlan=volumenTotal;

    }else if(objetivo>=inicio){

      const duracion=diasEntre(inicio,fin);

      if(duracion<=0){

        volumenPlan=volumenTotal;

      }else{

        const transcurrido=diasEntre(inicio,objetivo);

        const fraccion=
          Math.max(
            0,
            Math.min(
              1,
              transcurrido/duracion
            )
          );

        volumenPlan=volumenTotal*fraccion;
      }
    }

    resultado[tipo]=
      (resultado[tipo]||0)+volumenPlan;
  });

  return resultado;
}


function realPorTipoEnFecha(fecha){

  const objetivo=inicioDia(fecha);
  const resultado={};

  piezas.forEach(p=>{

    if(
      p.montada!==true ||
      !p.fecha_montaje
    ){
      return;
    }

    const fechaMontaje=
      inicioDia(new Date(p.fecha_montaje));

    if(fechaMontaje>objetivo){
      return;
    }

    const tipo=normalizarTipo(p.tipo);

    resultado[tipo]=
      (resultado[tipo]||0)+volumenPieza(p);
  });

  return resultado;
}


function abrirDetalleDesvio(){

  const hoy=inicioDia(new Date());

  const planTipos=planPorTipoEnFecha(hoy);
  const realTipos=realPorTipoEnFecha(hoy);

  const tipos=
    Array.from(
      new Set([
        ...Object.keys(planTipos),
        ...Object.keys(realTipos)
      ])
    );

  const filas=
    tipos
    .map(tipo=>{

      const plan=Number(planTipos[tipo]||0);
      const real=Number(realTipos[tipo]||0);
      const diferencia=real-plan;

      return{
        tipo,
        plan,
        real,
        diferencia
      };
    })
    .filter(item=>Math.abs(item.diferencia)>0.005)
    .sort(
      (a,b)=>
      Math.abs(b.diferencia)-
      Math.abs(a.diferencia)
    );


  const totalPlan=
    Object.values(planTipos)
    .reduce((s,v)=>s+Number(v||0),0);

  const totalReal=
    Object.values(realTipos)
    .reduce((s,v)=>s+Number(v||0),0);

  const totalDesvio=
    totalReal-totalPlan;


  document.getElementById("detallePlanTotal").textContent=
    formatoM3(totalPlan);

  document.getElementById("detalleRealTotal").textContent=
    formatoM3(totalReal);

  document.getElementById("detalleDesvioTotal").textContent=
    (totalDesvio>0?"+":"")+
    formatoM3(totalDesvio);


  const titulo=
    document.getElementById("modalDesvioTitulo");

  const explicacion=
    document.getElementById("detalleDesvioExplicacion");


  if(totalDesvio>0){

    titulo.textContent="Detalle del desvío positivo";

    explicacion.innerHTML=
      "El proyecto está <strong>adelantado</strong>. "+
      "Las filas verdes muestran qué tipos tienen más m³ montados que los planificados a hoy. "+
      "Las rojas muestran tipos que todavía están por debajo del plan.";

  }else if(totalDesvio<0){

    titulo.textContent="Detalle del desvío negativo";

    explicacion.innerHTML=
      "El proyecto está <strong>atrasado</strong>. "+
      "Las filas rojas muestran qué tipos explican los m³ que faltan respecto del plan a hoy. "+
      "Las verdes muestran tipos adelantados que compensan parte del atraso.";

  }else{

    titulo.textContent="Detalle del desvío";

    explicacion.innerHTML=
      "El proyecto está <strong>en línea</strong>: el total real coincide con el plan a hoy. "+
      "Puede haber diferencias entre tipos que se compensan entre sí.";
  }


  const tbody=
    document.getElementById("tablaDesvioBody");


  if(filas.length===0){

    tbody.innerHTML=`
      <tr>
        <td colspan="5" class="sin-pendientes">
          ✅ No hay diferencias relevantes por tipo
        </td>
      </tr>
    `;

  }else{

    tbody.innerHTML=
      filas.map(item=>{

        let clase="desvio-linea";
        let lectura="EN LÍNEA";

        if(item.diferencia>0.005){
          clase="desvio-sobra";
          lectura="ADELANTADO / SOBRA";
        }else if(item.diferencia<-0.005){
          clase="desvio-falta";
          lectura="FALTA";
        }

        return `
          <tr>
            <td><strong>${item.tipo}</strong></td>
            <td>${formatoM3(item.plan)}</td>
            <td>${formatoM3(item.real)}</td>
            <td class="${clase}">
              ${item.diferencia>0?"+":""}${formatoM3(item.diferencia)}
            </td>
            <td class="${clase}">${lectura}</td>
          </tr>
        `;
      }).join("");
  }


  document
    .getElementById("modalDesvio")
    .classList.remove("hidden");
}


function cerrarDetalleDesvio(event){

  if(event && event.target!==event.currentTarget){
    return;
  }

  document
    .getElementById("modalDesvio")
    .classList.add("hidden");
}


document.addEventListener("keydown",event=>{

  if(event.key==="Escape"){

    document
      .getElementById("modalDesvio")
      ?.classList.add("hidden");
  }
});


/* TOGGLES */

function toggleDetalle(boton){

  const detalle=
  boton.nextElementSibling;

  const abierto=
  detalle.classList.toggle("abierto");

  boton.textContent=
  abierto
  ?"Ocultar detalle ▲"
  :"Ver detalle ▼";
}


function toggleSeccion(contenidoId,botonId){

  const contenido=
  document.getElementById(contenidoId);

  const boton=
  document.getElementById(botonId);

  const cerrado=
  contenido.classList.toggle("hidden");

  boton.textContent=
  cerrado
  ?"Mostrar ▼"
  :"Ocultar ▲";

  if(
    contenidoId==="contenidoAvance" &&
    !cerrado
  ){

    setTimeout(()=>{

      if(chart){
        chart.resize();
      }

    },50);
  }
}
