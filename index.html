<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Premoldeados</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f7;
    color: #263238;
}

header {
    background: #263238;
    color: white;
    padding: 22px 30px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 6px 0 0;
    color: #cfd8dc;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.stat .number {
    font-size: 30px;
    font-weight: bold;
    color: #263238;
}

.stat .label {
    color: #607d8b;
    margin-top: 5px;
    font-size: 14px;
}

.toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.search {
    flex: 1;
    padding: 13px 15px;
    border: 1px solid #cfd8dc;
    border-radius: 9px;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 17px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #f57c00;
    color: white;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.piece-title {
    font-size: 19px;
    font-weight: bold;
}

.piece-type {
    color: #607d8b;
    font-size: 14px;
    margin-top: 4px;
}

.status {
    font-size: 13px;
    padding: 7px 11px;
    border-radius: 20px;
    background: #fff3e0;
    color: #e65100;
    font-weight: bold;
}

.steps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.step {
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
}

.step.completed {
    background: #e8f5e9;
    border-color: #81c784;
}

.icon {
    width: 34px;
    height: 34px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eceff1;
    color: #78909c;
    font-weight: bold;
}

.completed .icon {
    background: #43a047;
    color: white;
}

.step-name {
    font-size: 13px;
    font-weight: bold;
    margin-top: 9px;
}

.step-date {
    font-size: 11px;
    color: #78909c;
    margin-top: 5px;
}

.step button {
    margin-top: 9px;
    padding: 7px 9px;
    font-size: 11px;
    background: #eceff1;
    color: #37474f;
}

.completed button {
    background: #43a047;
    color: white;
}

@media (max-width: 800px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .steps {
        grid-template-columns: 1fr;
    }

    .toolbar {
        flex-direction: column;
    }
}
</style>

</head>

<body>

<header>
    <h1>🏗️ Control de Premoldeados</h1>
    <p>Seguimiento de fabricación, traslado, recepción, calidad y montaje</p>
</header>

<div class="container">

```
<div class="stats">
    <div class="stat">
        <div class="number" id="total">0</div>
        <div class="label">Total</div>
    </div>

    <div class="stat">
        <div class="number" id="taller">0</div>
        <div class="label">En taller</div>
    </div>

    <div class="stat">
        <div class="number" id="transito">0</div>
        <div class="label">En tránsito</div>
    </div>

    <div class="stat">
        <div class="number" id="obra">0</div>
        <div class="label">En obra</div>
    </div>

    <div class="stat">
        <div class="number" id="montados">0</div>
        <div class="label">Montados</div>
    </div>
</div>

<div class="toolbar">
    <input
        class="search"
        id="search"
        placeholder="🔎 Buscar por código o tipo..."
        oninput="render()"
    >

    <button class="btn-primary" onclick="addPiece()">
        + Nuevo premoldeado
    </button>
</div>

<div id="pieces"></div>
```

</div>

<script>

let pieces = [
    {
        id: "PM-00125",
        type: "Viga V-25",
        steps: [true, true, true, true, false],
        dates: [
            "28/08/2026 14:32",
            "29/08/2026 07:15",
            "29/08/2026 10:23",
            "29/08/2026 11:05",
            ""
        ]
    },
    {
        id: "PM-00126",
        type: "Columna C-12",
        steps: [true, true, false, false, false],
        dates: [
            "28/08/2026 15:10",
            "29/08/2026 07:40",
            "",
            "",
            ""
        ]
    },
    {
        id: "PM-00127",
        type: "Panel P-08",
        steps: [true, false, false, false, false],
        dates: [
            "29/08/2026 08:20",
            "",
            "",
            "",
            ""
        ]
    }
];

const stepNames = [
    "Liberado taller",
    "Salió del taller",
    "Llegó a obra",
    "Liberado calidad",
    "Montado"
];

function render() {

    const search = document
        .getElementById("search")
        .value
        .toLowerCase();

    const container = document.getElementById("pieces");

    const filtered = pieces.filter(p =>
        p.id.toLowerCase().includes(search) ||
        p.type.toLowerCase().includes(search)
    );

    container.innerHTML = "";

    filtered.forEach((piece, index) => {

        const completed = piece.steps.filter(Boolean).length;

        let status = "En taller";

        if (completed === 5) {
            status = "Montado";
        } else if (completed >= 4) {
            status = "Listo para montaje";
        } else if (completed >= 2) {
            status = "En obra";
        } else if (completed >= 1) {
            status = "En tránsito";
        }

        let html = `
        <div class="card">

            <div class="card-header">

                <div>
                    <div class="piece-title">${piece.id}</div>
                    <div class="piece-type">${piece.type}</div>
                </div>

                <div class="status">${status}</div>

            </div>

            <div class="steps">
        `;

        stepNames.forEach((name, stepIndex) => {

            const done = piece.steps[stepIndex];

            html += `
                <div class="step ${done ? "completed" : ""}">

                    <div class="icon">
                        ${done ? "✓" : stepIndex + 1}
                    </div>

                    <div class="step-name">
                        ${name}
                    </div>

                    <div class="step-date">
                        ${done ? piece.dates[stepIndex] : "Pendiente"}
                    </div>

                    <button onclick="toggleStep(${index}, ${stepIndex})">
                        ${done ? "Completado" : "Completar"}
                    </button>

                </div>
            `;
        });

        html += `
            </div>
        </div>
        `;

        container.innerHTML += html;
    });

    updateStats();
}

function toggleStep(pieceIndex, stepIndex) {

    pieces[pieceIndex].steps[stepIndex] =
        !pieces[pieceIndex].steps[stepIndex];

    if (pieces[pieceIndex].steps[stepIndex]) {

        const now = new Date();

        pieces[pieceIndex].dates[stepIndex] =
            now.toLocaleDateString("es-AR") +
            " " +
            now.toLocaleTimeString("es-AR", {
                hour: "2-digit",
                minute: "2-digit"
            });

    } else {

        pieces[pieceIndex].dates[stepIndex] = "";

    }

    render();
}

function addPiece() {

    const id = prompt("Código del premoldeado:");

    if (!id) return;

    const type = prompt("Tipo / descripción:");

    if (!type) return;

    pieces.push({
        id: id.toUpperCase(),
        type: type,
        steps: [false, false, false, false, false],
        dates: ["", "", "", "", ""]
    });

    render();
}

function updateStats() {

    document.getElementById("total").innerText =
        pieces.length;

    document.getElementById("taller").innerText =
        pieces.filter(p => p.steps[0] && !p.steps[1]).length;

    document.getElementById("transito").innerText =
        pieces.filter(p => p.steps[1] && !p.steps[2]).length;

    document.getElementById("obra").innerText =
        pieces.filter(p => p.steps[2] && !p.steps[4]).length;

    document.getElementById("montados").innerText =
        pieces.filter(p => p.steps[4]).length;
}

render();

</script>

</body>
</html>
