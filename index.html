<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Premoldeados</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #1e3a5f;
      color: white;
      padding: 25px 40px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.8;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tarjeta h3 {
      margin: 0;
      font-size: 14px;
      color: #6b7280;
    }

    .tarjeta .numero {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }

    .herramientas {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    #buscador {
      flex: 1;
      min-width: 220px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-nuevo {
      background: #1e3a5f;
      color: white;
    }

    .btn-avanzar {
      background: #16a34a;
      color: white;
      padding: 8px 12px;
    }

    .btn-eliminar {
      background: #dc2626;
      color: white;
      padding: 8px 12px;
      margin-left: 5px;
    }

    .formulario {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .formulario.activo {
      display: block;
    }

    .formulario h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .form-grid input,
    .form-grid select {
      width: 100%;
    }

    .btn-guardar {
      background: #1e3a5f;
      color: white;
      margin-top: 15px;
    }

    .tabla-contenedor {
      overflow-x: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th {
      background: #eaf0f6;
      text-align: left;
      padding: 15px;
      font-size: 13px;
    }

    td {
      padding: 15px;
      border-top: 1px solid #e5e7eb;
    }

    .estado {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }

    .taller {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .salio {
      background: #ffedd5;
      color: #c2410c;
    }

    .llego {
      background: #fef3c7;
      color: #a16207;
    }

    .calidad {
      background: #f3e8ff;
      color: #7e22ce;
    }

    .montado {
      background: #dcfce7;
      color: #15803d;
    }

    .vacio {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      main {
        padding: 20px 12px;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏗️ Control de Premoldeados</h1>
  <p>Seguimiento y trazabilidad de piezas desde el taller hasta el montaje</p>
</header>

<main>

  <!-- RESUMEN -->
  <section class="resumen">

    <div class="tarjeta">
      <h3>TOTAL</h3>
      <div class="numero" id="total">0</div>
    </div>

    <div class="tarjeta">
      <h3>EN TALLER</h3>
      <div class="numero" id="totalTaller">0</div>
    </div>

    <div class="tarjeta">
      <h3>EN OBRA</h3>
      <div class="numero" id="totalObra">0</div>
    </div>

    <div class="tarjeta">
      <h3>MONTADOS</h3>
      <div class="numero" id="totalMontados">0</div>
    </div>

  </section>


  <!-- BUSCADOR Y BOTON -->
  <section class="herramientas">

    <input
      type="text"
      id="buscador"
      placeholder="🔎 Buscar por código o tipo..."
    >

    <button class="btn-nuevo" onclick="mostrarFormulario()">
      + Nuevo premoldeado
    </button>

  </section>


  <!-- FORMULARIO -->
  <section class="formulario" id="formulario">

    <h2>Nuevo premoldeado</h2>

    <div class="form-grid">

      <input
        type="text"
        id="codigo"
        placeholder="Código (ej: V-001)"
      >

      <select id="tipo">
        <option value="">Seleccionar tipo</option>
        <option>Viga</option>
        <option>Columna</option>
        <option>Losa</option>
        <option>Panel</option>
        <option>Base</option>
        <option>Otro</option>
      </select>

    </div>

    <button class="btn-guardar" onclick="agregarPremoldeado()">
      Guardar premoldeado
    </button>

  </section>


  <!-- TABLA -->
  <section class="tabla-contenedor">

    <table>

      <thead>
        <tr>
          <th>CÓDIGO</th>
          <th>TIPO</th>
          <th>ESTADO ACTUAL</th>
          <th>ACCIÓN</th>
        </tr>
      </thead>

      <tbody id="tablaPremoldeados">
      </tbody>

    </table>

    <div id="mensajeVacio" class="vacio">
      Todavía no hay premoldeados cargados.
    </div>

  </section>

</main>


<script>

  /*
    ETAPAS DEL PROCESO
  */

  const etapas = [
    {
      nombre: "🏭 TALLER",
      clase: "taller"
    },
    {
      nombre: "🚛 SALIÓ A OBRA",
      clase: "salio"
    },
    {
      nombre: "📍 LLEGÓ A OBRA",
      clase: "llego"
    },
    {
      nombre: "🔍 CALIDAD",
      clase: "calidad"
    },
    {
      nombre: "🏗️ MONTADO",
      clase: "montado"
    }
  ];


  /*
    CARGAR DATOS GUARDADOS
  */

  let premoldeados =
    JSON.parse(localStorage.getItem("premoldeados")) || [];


  /*
    MOSTRAR / OCULTAR FORMULARIO
  */

  function mostrarFormulario() {

    document
      .getElementById("formulario")
      .classList.toggle("activo");

  }


  /*
    AGREGAR NUEVO PREMOLDEADO
  */

  function agregarPremoldeado() {

    const codigo =
      document.getElementById("codigo").value.trim();

    const tipo =
      document.getElementById("tipo").value;


    if (!codigo || !tipo) {

      alert("Por favor completá el código y el tipo.");

      return;

    }


    /*
      VERIFICAR QUE NO EXISTA
    */

    const existe =
      premoldeados.some(
        p =>
          p.codigo.toLowerCase() ===
          codigo.toLowerCase()
      );


    if (existe) {

      alert("Ya existe un premoldeado con ese código.");

      return;

    }


    /*
      CREAR PREMOLDEADO

      etapa: 0 = TALLER
    */

    premoldeados.push({

      codigo: codigo,

      tipo: tipo,

      etapa: 0,

      fechaCreacion:
        new Date().toLocaleString()

    });


    guardarDatos();


    /*
      LIMPIAR FORMULARIO
    */

    document.getElementById("codigo").value = "";

    document.getElementById("tipo").value = "";


    document
      .getElementById("formulario")
      .classList.remove("activo");


    renderizar();

  }


  /*
    AVANZAR A LA SIGUIENTE ETAPA
  */

  function avanzarEtapa(indice) {

    if (
      premoldeados[indice].etapa <
      etapas.length - 1
    ) {

      premoldeados[indice].etapa++;

      guardarDatos();

      renderizar();

    }

  }


  /*
    ELIMINAR PREMOLDEADO
  */

  function eliminarPremoldeado(indice) {

    const confirmar =
      confirm(
        "¿Seguro que querés eliminar este premoldeado?"
      );


    if (confirmar) {

      premoldeados.splice(indice, 1);

      guardarDatos();

      renderizar();

    }

  }


  /*
    GUARDAR EN EL NAVEGADOR
  */

  function guardarDatos() {

    localStorage.setItem(
      "premoldeados",
      JSON.stringify(premoldeados)
    );

  }


  /*
    MOSTRAR TABLA
  */

  function renderizar() {

    const tabla =
      document.getElementById("tablaPremoldeados");

    const mensajeVacio =
      document.getElementById("mensajeVacio");


    tabla.innerHTML = "";


    const busqueda =
      document
        .getElementById("buscador")
        .value
        .toLowerCase();


    const filtrados =
      premoldeados.filter(p =>
        p.codigo.toLowerCase().includes(busqueda) ||
        p.tipo.toLowerCase().includes(busqueda)
      );


    if (filtrados.length === 0) {

      mensajeVacio.style.display = "block";

    } else {

      mensajeVacio.style.display = "none";

    }


    filtrados.forEach(p => {

      /*
        BUSCAR INDICE REAL
      */

      const indice =
        premoldeados.indexOf(p);


      const estado =
        etapas[p.etapa];


      const botonAvanzar =
        p.etapa < etapas.length - 1

          ? `
            <button
              class="btn-avanzar"
              onclick="avanzarEtapa(${indice})"
            >
              Avanzar
            </button>
          `

          : `
            <strong>✓ Finalizado</strong>
          `;


      tabla.innerHTML += `

        <tr>

          <td>
            <strong>${p.codigo}</strong>
          </td>

          <td>
            ${p.tipo}
          </td>

          <td>

            <span
              class="estado ${estado.clase}"
            >
              ${estado.nombre}
            </span>

          </td>

          <td>

            ${botonAvanzar}

            <button
              class="btn-eliminar"
              onclick="eliminarPremoldeado(${indice})"
            >
              Eliminar
            </button>

          </td>

        </tr>

      `;

    });


    actualizarResumen();

  }


  /*
    ACTUALIZAR RESUMEN
  */

  function actualizarResumen() {

    document.getElementById("total").textContent =
      premoldeados.length;


    document
      .getElementById("totalTaller")
      .textContent =
      premoldeados.filter(
        p => p.etapa === 0
      ).length;


    /*
      EN OBRA:

      SALIÓ
      LLEGÓ
      CALIDAD
    */

    document
      .getElementById("totalObra")
      .textContent =
      premoldeados.filter(
        p =>
          p.etapa >= 1 &&
          p.etapa <= 3
      ).length;


    document
      .getElementById("totalMontados")
      .textContent =
      premoldeados.filter(
        p => p.etapa === 4
      ).length;

  }


  /*
    BUSCADOR
  */

  document
    .getElementById("buscador")
    .addEventListener(
      "input",
      renderizar
    );


  /*
    INICIAR PAGINA
  */

  renderizar();

</script>

</body>
</html>
